name: Build XR1710G latest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr1710g-latest-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Checkout pinned source
        run: |
          git clone --filter=blob:none https://github.com/YYH2913/openwrt.git source
          cd source
          git checkout 9e44788d769164dc9f691670add71dc466d99a4c
          test "$(git rev-parse HEAD)" = "9e44788d769164dc9f691670add71dc466d99a4c"
          git log -1 --oneline

      - name: Configure XR1710G
        working-directory: source
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -q '^CONFIG_TARGET_airoha=y$' .config
          grep -q '^CONFIG_TARGET_airoha_an7581=y$' .config
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y$' .config
          grep -E '^CONFIG_(TARGET_airoha|PACKAGE_luci|PACKAGE_airoha-en7581-mt7996-npu-firmware)' .config | head -80

      - name: Download sources
        working-directory: source
        run: |
          make -j8 download || make -j1 download V=s

      - name: Build firmware
        working-directory: source
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Collect outputs
        if: always()
        working-directory: source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          test -f .config && cp .config "$GITHUB_WORKSPACE/artifacts/build.config" || true
          test -f build.log && cp build.log "$GITHUB_WORKSPACE/artifacts/build.log" || true
          if [ -d bin/targets/airoha/an7581 ]; then
            for output in bin/targets/airoha/an7581/*; do
              if [ -f "$output" ]; then
                cp -v "$output" "$GITHUB_WORKSPACE/artifacts/"
              fi
            done
          fi
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-latest-firmware
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-build-log
          path: artifacts/build.log
          if-no-files-found: warn
